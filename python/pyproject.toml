[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truefigure-sdk"
version = "0.1.0"
description = "TrueFigure SDK - the measurement contract for AI value verification (witness events; read graded figures)"
requires-python = ">=3.9"
license = { text = "Proprietary" }

[tool.setuptools]
packages = ["truefigure"]

[tool.setuptools.package-data]
truefigure = ["error_codes.json"]
